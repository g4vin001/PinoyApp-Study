name: Publish AppPinoy Study

on:
  push:
    branches: [main]
    paths:
      - study-site.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check the site archive
        run: |
          sha256sum --check study-site.zip.sha256
          unzip -q study-site.zip -d "$RUNNER_TEMP/study-site"
          test -s "$RUNNER_TEMP/study-site/index.html"
          test -s "$RUNNER_TEMP/study-site/learn/index.html"
          test -s "$RUNNER_TEMP/study-site/course/index.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/study-site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
